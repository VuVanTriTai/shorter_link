spring.application.name=smart-link-shortener

# ===== Database Configuration =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_link_shortener}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== JWT Configuration =====
jwt.secret=${JWT_SECRET:}
# Access token het han sau 15 phut (900000 ms)
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
# Refresh token het han sau 7 ngay (604800 giay)
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800}

# ===== Redis Configuration =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# ===== URL Security & Safe Browsing Configuration =====
app.security.self-domains=${APP_DOMAINS:localhost,127.0.0.1,0.0.0.0}
app.security.allow-localhost-targets=false
app.security.check-reachability=true
# Dien Google Safe Browsing API Key tai day
google.safebrowsing.api-key=${GOOGLE_SAFEBROWSING_KEY:}

# ===== Google OAuth 2.0 Configuration =====
# Tao OAuth 2.0 Client ID tai: https://console.cloud.google.com/apis/credentials
google.oauth2.client-id=${GOOGLE_OAUTH_CLIENT_ID:}

# Tat Kafka auto-config neu chua dung (de tranh loi startup)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration